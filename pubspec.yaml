name: back_2_campus
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.12.0
  file_picker: ^5.5.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png

# ✅ MUST BE OUTSIDE flutter:
flutter_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/images/app_icon.png
